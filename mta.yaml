_schema-version: 3.3.0
ID: kundenmonitor-btp
version: 0.1.0
description: "Kundenmonitor BTP – Rebuild of ZEC_CUSTOMER_MONITOR (CAP + Fiori Elements V4)"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: kundenmonitor-btp-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      # O-03: CF restarts the app when /health (CAP, no login) stops answering
      health-check-type: http
      health-check-http-endpoint: /health
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: kundenmonitor-btp-auth
      - name: kundenmonitor-btp-db
      - name: kundenmonitor-btp-destination
      - name: kundenmonitor-btp-logging # O-03, inactive unless mta-cloud-logging.mtaext is used

  - name: kundenmonitor-btp-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: kundenmonitor-btp-db

  - name: kundenmonitor-btp-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: kundenmonitor-btp-auth
      - name: srv-api
      - name: kundenmonitor-btp-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: app/
      requires:
        - name: kundenmonitorbtpmonitor
          artifacts:
            - monitor.zip
          target-path: app/
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet

  - name: kundenmonitorbtpmonitor
    type: html5
    path: app/monitor
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build # dependencies come from the root npm ci (workspace)
      supported-platforms:
        []

  - name: kundenmonitor-btp-destinations
    type: com.sap.application.content
    requires:
      - name: kundenmonitor-btp-auth
        parameters:
          service-key:
            name: kundenmonitor-btp-auth-key
      - name: kundenmonitor-btp-html5-repo-host
        parameters:
          service-key:
            name: kundenmonitor-btp-html5-repo-host-key
      - name: srv-api
      - name: kundenmonitor-btp-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: kundenmonitor-btp-html5-repository
              ServiceInstanceName: kundenmonitor-btp-html5-repo-host
              ServiceKeyName: kundenmonitor-btp-html5-repo-host-key
              sap.cloud.service: kundenmonitorbtp.service
            - Name: kundenmonitor-btp-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: kundenmonitor-btp-auth
              ServiceKeyName: kundenmonitor-btp-auth-key
              sap.cloud.service: kundenmonitorbtp.service

resources:
  - name: kundenmonitor-btp-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: kundenmonitor-btp-${org}-${space}
        tenant-mode: dedicated
  - name: kundenmonitor-btp-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: kundenmonitor-btp-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true

  - name: kundenmonitor-btp-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: kundenmonitor-btp-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  # O-03: SAP Cloud Logging, opt-in (entitlement needed) – activate with -e mta-cloud-logging.mtaext;
  # CAP formats its logs for Cloud Logging automatically once bound (cds.env.log.aspects: cls)
  - name: kundenmonitor-btp-logging
    type: org.cloudfoundry.managed-service
    active: false
    parameters:
      service: cloud-logging
      service-plan: standard
