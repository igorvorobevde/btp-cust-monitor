<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Kundenmonitor</title>
	<script
		id="sap-ui-bootstrap"
		src="https://ui5.sap.com/1.148.12/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-resource-roots='{ "hydac.custmon": "./" }'
		data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
		data-sap-ui-compat-version="edge"
		data-sap-ui-xx-component-preload="off"
		data-sap-ui-async="true"
		data-sap-ui-frame-options="trusted">
	</script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
	<div class="custmonRoot"
		data-sap-ui-component
		data-name="hydac.custmon"
		data-id="container"
		data-settings='{ "id": "custmon" }'
		data-height="100%">
	</div>
</body>
</html>
